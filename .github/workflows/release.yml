#
# Release workflow for an App Lab brick repository.
#
# Publish a release on GitHub (from the UI, or `gh release create <tag>`): this
# workflow builds the zip of the release layout at the tag (src/<brick_name>/,
# examples/, docs/API.md and LICENSE: the rest of the repository stays out), checks it with the
# same rules the registry bot applies to a submission (layout: one brick module
# in src/<brick_name>/ with its README.md, LICENSE, examples/<example>/ apps;
# brick_config.yaml fields; images of brick_compose.yaml and of its board
# variants brick_compose.<board>.yaml pinned by digest;
# tag = version, brick_repo = this repository), attaches it to the
# release, and appends to the release notes a link that opens the submission
# form of the Arduino App Brick registry already filled in: issue title (the
# brick `name`), zip URL and SHA-256. A zip that would be rejected by the
# registry fails here, before the release carries it, and the release notes say
# so with a link to the run.
#
# Copy this file to .github/workflows/release.yml of your brick repository.
# REGISTRY is the catalog repository the submission form belongs to.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  REGISTRY: bcmi-labs/brick-registry

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # The Python of the App Bricks base image: the check compares the brick name
      # with the standard library modules of this version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet "pyyaml==6.0.2"

      - name: Build the zip of the release layout
        run: |
          mkdir -p dist
          # Only what the registry accepts in a release zip, at the zip root:
          # src/<name>/, examples/, docs/API.md and LICENSE, as they are at the
          # tag. The rest of the repository (README.md, .github/, tests, tools,
          # ...) stays out: the zip is what App Lab extracts on the board.
          paths=()
          for path in src examples docs/API.md LICENSE; do
            if [ -n "$(git ls-tree -r --name-only "$TAG" -- "$path" | head -n 1)" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::nothing to release: the repository has no src/ folder at tag $TAG"; exit 1
          fi
          git archive --format=zip -o dist/brick.zip "$TAG" -- "${paths[@]}"

      # Mirror of the checks in .github/scripts/submit.py of the registry
      # (inspect_zip, read_config and read_compose). Keep the two in sync.
      - name: Check the zip as the registry bot will
        id: brick
        run: |
          python - dist/brick.zip "$TAG" <<'PY'
          import keyword, re, sys, zipfile
          from pathlib import Path
          import yaml

          zip_path, tag = Path(sys.argv[1]), sys.argv[2]
          REQUIRED_BRICK_FILES = ("__init__.py", "brick_config.yaml", "README.md")
          REQUIRED_REPO_FILES = ("LICENSE",)
          REQUIRED_EXAMPLE_FILES = ("app.yaml", "python/main.py")
          # the Arduino App specification: app folder name, sketch folder files, runtime folders
          EXAMPLE_NAME_RE = re.compile(r"^[A-Za-z0-9_ -]+$")
          REQUIRED_SKETCH_FILES = ("sketch.ino", "sketch.yaml")
          RESERVED_EXAMPLE_DIRS = (".cache", "data")

          def example_problem(example, files):
              base = f"examples/{example}/"
              if not EXAMPLE_NAME_RE.match(example):
                  return f"the example folder `examples/{example}/` has an invalid name: an app folder may contain only letters, digits, underscores, dashes and spaces"
              for required in REQUIRED_EXAMPLE_FILES:
                  if base + required not in files:
                      return f"`{base}` is not an App Lab app: `{required}` is missing"
              if any(f.startswith(base + "sketch/") for f in files):
                  for required in REQUIRED_SKETCH_FILES:
                      if f"{base}sketch/{required}" not in files:
                          return f"`{base}sketch/` is not a valid sketch folder: `{required}` is missing"
              for reserved in RESERVED_EXAMPLE_DIRS:
                  if any(f.startswith(f"{base}{reserved}/") for f in files):
                      return f"`{base}{reserved}/` must not be published: `{reserved}` is a folder the app fills at runtime, remove it from the repository"
              return None
          NAME_RE = re.compile(r"^[a-z][a-z0-9_]*$")  # namespace and brick name
          IDENTIFIER_RULE = "a lowercase Python identifier (letters, digits and `_`, starting with a letter, not a Python keyword)"

          def identifier_problem(what, value):
              if keyword.iskeyword(value):
                  return f"{what} `{value}` is a Python keyword: it must be {IDENTIFIER_RULE}"
              if NAME_RE.match(value):
                  return None
              hint = value.replace("-", "_")
              suggestion = f"; for example `{hint}`" if hint != value and NAME_RE.match(hint) and not keyword.iskeyword(hint) else ""
              return f"{what} `{value}` must be {IDENTIFIER_RULE}{suggestion}"

          # an app imports a brick by its name: not the name of a module it already has.
          # The standard library is the one of this interpreter, the Python of the base image.
          RESERVED_BRICK_NAMES = ("arduino",)

          def reserved_name_problem(what, value):
              if value in sys.stdlib_module_names:
                  owner = "a module of the Python standard library"
              elif value in RESERVED_BRICK_NAMES:
                  owner = "the package of the Arduino App framework"
              else:
                  return None
              return f"{what} `{value}` is the name of {owner}: an app imports a brick by its name, so the two would clash; choose another name"
          HANDLE_RE = re.compile(r"^[A-Za-z0-9](?:-?[A-Za-z0-9]){0,38}$")
          SEMVER_RE = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$")

          def fail(msg):
              print(f"::error::{msg}"); sys.exit(1)

          # --- the archive, as the bot inspects it
          try:
              zf = zipfile.ZipFile(zip_path)
          except zipfile.BadZipFile:
              fail("the file is not a valid zip archive")
          MAX_EXTRACTED_BYTES = 200 * 1024 * 1024
          MAX_EXTRACTED_FILE_BYTES = 100 * 1024 * 1024

          def human_size(size):
              if size < 1024:
                  return f"{size} B"
              if size < 1024 * 1024:
                  return f"{size / 1024:.1f} KB"
              return f"{size / (1024 * 1024):.1f} MB"

          with zf:
              largest = max(zf.infolist(), key=lambda i: i.file_size, default=None)
              if largest is not None and largest.file_size > MAX_EXTRACTED_FILE_BYTES:
                  fail(f"`{largest.filename}` is {human_size(largest.file_size)} once extracted: a file in the zip can be at most {human_size(MAX_EXTRACTED_FILE_BYTES)}")
              extracted = sum(i.file_size for i in zf.infolist())
              if extracted > MAX_EXTRACTED_BYTES:
                  fail(f"the zip is {human_size(extracted)} once extracted: the limit is {human_size(MAX_EXTRACTED_BYTES)}")
              if zf.testzip() is not None:
                  fail("the zip archive is corrupt")
              entries = []
              for info in zf.infolist():
                  name = info.filename
                  if name.startswith(("/", "\\")) or ".." in Path(name).parts:
                      fail(f"unsafe path in the zip: `{name}`")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      fail(f"symlinks are not allowed in the zip: `{name}`")
                  parts = [p for p in name.split("/") if p]
                  if not parts:
                      continue
                  if "__MACOSX" in parts or "__pycache__" in parts:
                      fail(f"remove `__pycache__`/`__MACOSX` from the repository (`{name}`)")
                  if not info.is_dir() and (info.external_attr >> 16) & 0o111:
                      fail(f"executable files are not allowed in the zip: `{name}` (chmod -x and commit)")
                  entries.append((parts, info.is_dir()))
              roots = {p[0] for p, _ in entries}
              if "src" in roots or "bricks" in roots:
                  prefix = ""
              elif len(roots) == 1 and any(len(p) > 1 for p, _ in entries):
                  prefix = next(iter(roots))
              else:
                  fail("the repository must have a `src/<brick_name>/` folder at its root")
              rel = [(p[1:] if prefix else p, d) for p, d in entries]
              rel = [(p, d) for p, d in rel if p]
              files = ["/".join(p) for p, d in rel if not d]
              if not any(p[0] == "src" for p, _ in rel):
                  if any(p[0] == "bricks" for p, _ in rel):
                      fail("old layout with the brick in `bricks/<brick_name>/`: move the module to `src/<brick_name>/` (its README.md with it) and its examples to `examples/` at the repository root, next to `LICENSE`")
                  fail("no `src/<brick_name>/` folder found")
              loose = sorted("/".join(p) for p, d in rel if p[0] == "src" and len(p) == 2 and not d)
              if loose:
                  fail("`src/` must contain only the brick folder, found the file(s): " + ", ".join(loose))
              brick_names = {p[1] for p, _ in rel if len(p) > 1 and p[0] == "src"}
              if len(brick_names) > 1:
                  fail("`src/` must contain exactly one brick folder, found: " + ", ".join(sorted(brick_names)))
              brick = next(iter(brick_names))
              problem = identifier_problem("the brick folder", brick) or reserved_name_problem("the brick folder", brick)
              if problem:
                  fail(f"{problem} (`src/{brick}/`)")
              for required in REQUIRED_BRICK_FILES:
                  if f"src/{brick}/{required}" not in files:
                      moved = f": the brick documentation moved from `docs/README.md` to `src/{brick}/README.md`" if required == "README.md" and "docs/README.md" in files else ""
                      fail(f"`src/{brick}/{required}` is missing{moved}")
              if any(p[:3] == ["src", brick, "examples"] for p, _ in rel):
                  fail(f"`src/{brick}/examples/` is not part of the module: move `examples/` to the repository root, next to `src/`")
              for required in REQUIRED_REPO_FILES:
                  if required not in files:
                      fail(f"`{required}` is missing")
              misnamed = sorted(f for f in files if f.lower() == "docs/api.md" and f != "docs/API.md")
              if misnamed:
                  fail(f"`{misnamed[0]}` must be named `docs/API.md`, with this exact case: App Lab reads the API documentation from that path and file names are case-sensitive on the board")
              extra = set()
              for f in files:
                  if f in REQUIRED_REPO_FILES or f == "docs/API.md" or f.startswith((f"src/{brick}/", "examples/")):
                      continue
                  top, _, rest = f.partition("/")
                  extra.add(f if not rest or top == "docs" else f"{top}/")
              if extra:
                  fail("the zip holds files outside the release layout: " + ", ".join(f"`{e}`" for e in sorted(extra)) + ". A release zip holds only `src/<brick_name>/`, `examples/`, `docs/API.md` and `LICENSE`: build it with the release workflow of the registry (`templates/release.yml`), which leaves the rest of the repository out")
              examples = sorted({p[1] for p, _ in rel if len(p) > 2 and p[0] == "examples"})
              for example in examples:
                  problem = example_problem(example, files)
                  if problem:
                      fail(problem)
              config_text = zf.read(f"{prefix + '/' if prefix else ''}src/{brick}/brick_config.yaml").decode("utf-8")
              # brick_compose.yaml, then the board variants brick_compose.<board>.yaml that
              # arduino-app-cli runs instead of it on that board: all checked the same way
              compose_base = f"src/{brick}/brick_compose.yaml"
              compose_rels = ([compose_base] if compose_base in files else []) + sorted(
                  f for f in files if re.match(rf"^src/{brick}/brick_compose\.[^/]+\.yaml$", f))
              compose_texts = {r: zf.read(f"{prefix + '/' if prefix else ''}{r}").decode("utf-8") for r in compose_rels}

          # --- brick_config.yaml, as the bot reads it
          try:
              cfg = yaml.safe_load(config_text)
          except yaml.YAMLError as e:
              fail(f"`brick_config.yaml` cannot be parsed: {e}")
          if not isinstance(cfg, dict):
              fail("`brick_config.yaml` must be a YAML mapping")
          missing = [k for k in ("id", "version", "name", "description", "author", "author_handle", "brick_repo") if not str(cfg.get(k) or "").strip()]
          if missing:
              fail("`brick_config.yaml` is missing required fields: " + ", ".join(f"`{k}`" for k in missing))
          brick_id = str(cfg["id"]).strip()
          if brick_id.count(":") != 1:
              fail(f"`id: {brick_id}` must have the form `<namespace>:<brick_name>`")
          ns, name = brick_id.split(":")
          problem = identifier_problem("namespace", ns) or identifier_problem("brick name", name) or reserved_name_problem("brick name", name)
          if problem:
              fail(problem)
          if ns == "arduino":
              fail("the `arduino` namespace is reserved")
          if name != brick:
              fail(f"brick name `{name}` in the id does not match the folder `src/{brick}/`: folder name, brick name and Python module must coincide")
          handle = str(cfg["author_handle"]).strip().lstrip("@")
          if not HANDLE_RE.match(handle):
              fail(f"`author_handle: {handle}` is not a GitHub login")
          version = str(cfg["version"]).strip()
          if not SEMVER_RE.match(version):
              fail(f"`version: {version}` is not a semantic version (MAJOR.MINOR.PATCH)")
          if not str(cfg["brick_repo"]).strip().startswith("https://"):
              fail(f"`brick_repo: {cfg['brick_repo']}` must be an HTTPS URL")
          variables = cfg.get("variables") or []
          if not isinstance(variables, list) or any(not isinstance(v, dict) or not v.get("name") or not v.get("description") for v in variables):
              fail("`variables` must be a list and every variable needs `name` and `description`")
          if cfg.get("min_app_cli") is not None and not SEMVER_RE.match(str(cfg["min_app_cli"])):
              fail(f"`min_app_cli: {cfg['min_app_cli']}` is not a semantic version")
          if cfg.get("license") is not None and not str(cfg["license"]).strip():
              fail("`license` is present but empty; use an SPDX identifier such as `MIT` or `MPL-2.0`")
          for key in ("supported_boards", "requires_services", "ai_frameworks_compatibility"):
              v = cfg.get(key)
              if v is not None and (not isinstance(v, list) or not v or not all(isinstance(x, str) and x.strip() for x in v)):
                  fail(f"`{key}` must be a non-empty list of strings")
          unknown = [b.strip() for b in cfg.get("supported_boards") or [] if b.strip() not in ("unoq", "ventunoq")]
          if unknown:
              fail("`supported_boards` has unknown board(s) " + ", ".join(f"`{b}`" for b in unknown) + ": the boards are `unoq`, `ventunoq`")
          for key in ("requires_display", "model"):
              v = cfg.get(key)
              if v is not None and (not isinstance(v, str) or not v.strip()):
                  fail(f"`{key}` must be a non-empty string")
          devices = cfg.get("required_devices")
          if devices is not None and (not isinstance(devices, list) or not devices or not all(d in ("camera", "microphone", "speaker") for d in devices)):
              fail("`required_devices` must be a non-empty list of `camera`, `microphone`, `speaker`; omit the field when the brick uses no device")
          if cfg.get("mount_devices_into_container") is not None and not isinstance(cfg["mount_devices_into_container"], bool):
              fail("`mount_devices_into_container` must be `true` or `false`")
          ports = cfg.get("ports")
          if ports is not None and (not isinstance(ports, list) or not ports or not all(isinstance(x, int) and not isinstance(x, bool) and 1 <= x <= 65535 for x in ports)):
              fail("`ports` must be a non-empty list of integers between 1 and 65535")
          mbb = cfg.get("model_by_boards")
          if mbb is not None and (not isinstance(mbb, list) or not mbb or not all(isinstance(x, dict) and str(x.get("platform") or "").strip() and str(x.get("model") or "").strip() for x in mbb)):
              fail("`model_by_boards` must be a non-empty list of `{platform, model}` entries")

          # --- brick_compose.yaml and its board variants, as the bot reads them: every service image pinned by digest
          SERVICE_RE = re.compile(r"^[a-zA-Z0-9][a-zA-Z0-9_.-]*$")
          REPO_RE = re.compile(
              r"^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)*(?::[0-9]+)?/)?"
              r"[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*$"
          )
          TAG_RE = re.compile(r"^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$")
          DIGEST_RE = re.compile(r"^sha256:[0-9a-f]{64}$")
          containers = []
          for where, compose_text in compose_texts.items():
              try:
                  compose = yaml.safe_load(compose_text)
              except yaml.YAMLError as e:
                  fail(f"`{where}` cannot be parsed: {e}")
              services = compose.get("services") if isinstance(compose, dict) else None
              if not isinstance(services, dict) or not services:
                  fail(f"`{where}` must be a YAML mapping with a non-empty `services` mapping")
              for service, spec in services.items():
                  service = str(service)
                  if not SERVICE_RE.match(service):
                      fail(f"service name `{service}` in `{where}` must match [a-zA-Z0-9._-]")
                  if spec is not None and not isinstance(spec, dict):
                      fail(f"service `{service}` in `{where}` must be a mapping")
                  spec = spec or {}
                  if "build" in spec:
                      fail(f"service `{service}` in `{where}`: `build` is not allowed, publish an image and pin it by digest")
                  image = spec.get("image")
                  if image is None:
                      fail(f"service `{service}` in `{where}` has no `image`; publish an image and pin it by digest")
                  if not isinstance(image, str) or not image.strip():
                      fail(f"service `{service}` in `{where}`: `image` must be a non-empty string")
                  image = image.strip()
                  if "$" in image:
                      fail(f"service `{service}` in `{where}`: image `{image}` uses variable interpolation, which cannot be verified; write the full image reference, pinned by digest")
                  if "@" not in image:
                      fail(f"service `{service}` in `{where}`: image `{image}` is not pinned by digest; use `<image>@sha256:<digest>` or `<image>:<tag>@sha256:<digest>` (see the registry README for how to get the digest)")
                  ref, digest = image.rsplit("@", 1)
                  if not DIGEST_RE.match(digest):
                      fail(f"service `{service}` in `{where}`: image `{image}` has a malformed digest `{digest}`; expected `sha256:` followed by 64 lowercase hexadecimal characters")
                  repo, tag_ = ref.rsplit(":", 1) if ":" in ref.rsplit("/", 1)[-1] else (ref, None)
                  if not REPO_RE.match(repo) or (tag_ is not None and not TAG_RE.match(tag_)):
                      fail(f"service `{service}` in `{where}`: `{image}` is not a valid image reference (`[registry/]repository[:tag]@sha256:<digest>`, repository in lowercase)")
                  containers.append(f"{service} ({image})" + ("" if where == compose_base else f" [{where.rsplit('/', 1)[-1]}]"))

          # --- the release
          # the tag is the version, as it is: the registry links the documentation at the tag
          if tag != version:
              fail(f"tag `{tag}` is not `version: {version}` of brick_config.yaml: the tag of a release is its version, without a prefix (`1.2.0`, not `v1.2.0`)")
          # the version is published from the repository the brick declares
          import os
          here = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          if str(cfg["brick_repo"]).strip().rstrip("/").removesuffix(".git").lower() != here.lower():
              fail(f"`brick_repo: {cfg['brick_repo']}` is not this repository: set it to `{here}`")

          api = "docs/API.md" if "docs/API.md" in files else "no docs/API.md"
          print(f"ok: {brick_id} {version}, {len(files)} files, module src/{brick}/, {api}, examples: {', '.join(examples) or 'none'}, containers: {', '.join(containers) or 'none'}")
          import os
          # display name on one line: it becomes the prefilled issue title
          display_name = " ".join(str(cfg["name"]).split())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={brick}\nversion={version}\ndisplay_name={display_name}\n")
          PY

      - name: Name the zip and compute its SHA-256
        id: zip
        env:
          NAME: ${{ steps.brick.outputs.name }}
          VERSION: ${{ steps.brick.outputs.version }}
        run: |
          set -euo pipefail
          file="$NAME-$VERSION.zip"
          mv dist/brick.zip "dist/$file"
          sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          unzip -l "dist/$file"

      - name: Attach the zip to the release
        env:
          FILE: ${{ steps.zip.outputs.file }}
        run: gh release upload "$TAG" "dist/$FILE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Append the submission details to the release notes
        env:
          FILE: ${{ steps.zip.outputs.file }}
          SHA: ${{ steps.zip.outputs.sha }}
          DISPLAY_NAME: ${{ steps.brick.outputs.display_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
          # the registry bot completes the title as "[submission] <name> <version>"
          form=$(python3 -c 'import sys, urllib.parse as u; print("https://github.com/" + sys.argv[1] + "/issues/new?" + u.urlencode({"template": "submit-brick.yml", "title": sys.argv[2], "zip-url": sys.argv[3], "sha256": sys.argv[4]}, quote_via=u.quote))' "$REGISTRY" "$DISPLAY_NAME" "$url" "$SHA")
          {
            printf '%s\n\n---\n\n' "$NOTES"
            printf '[Click here to submit this release to Arduino® App Brick registry](%s)\n' "$form"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "zip: $url"
          echo "sha256: $SHA"

      - name: Mark the release as not submittable
        if: failure()
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '%s\n\n---\n\n' "$NOTES"
            printf '## ⚠️ Release not submittable to the Arduino® App Brick registry\n\n'
            printf 'The release workflow failed, so this release has no zip to submit. The reason is in [the workflow run](%s): fix the repository and publish a new release.\n' "$run_url"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
