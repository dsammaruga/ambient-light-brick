id: dsammaruga:ambient_light
version: 1.0.1
name: Ambient Light
description: Reads an ambient light sensor and reports illuminance in lux with a dark/bright state.
category: miscellaneous
author: Dario Sammaruga
brick_repo: https://github.com/dsammaruga/ambient-light-brick
license: MPL-2.0
variables:
  - name: LIGHT_THRESHOLD_LUX
    description: Illuminance below which the environment is reported as dark
    default_value: "100"
  - name: LIGHT_PERIOD_SEC
    description: Seconds between two readings
    default_value: "2"
