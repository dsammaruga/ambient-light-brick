#
# Release workflow for an App Lab brick repository.
#
# Publish a release on GitHub (from the UI, or `gh release create <tag>`): this
# workflow builds the zip of the repository tree at the tag, checks it with the
# same rules the registry bot applies to a submission (layout: one brick module
# in src/<brick_name>/, docs/README.md, LICENSE, examples/<example>/ apps;
# brick_config.yaml fields; tag = version), attaches it to the
# release, and appends to the release notes a link that opens the submission
# form of the Arduino App Brick registry already filled in: issue title (the
# brick `name`), zip URL and SHA-256. A zip that would be rejected by the
# registry fails here, before the release carries it, and the release notes say
# so with a link to the run.
#
# Copy this file to .github/workflows/release.yml of your brick repository.
# REGISTRY is the catalog repository the submission form belongs to.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  REGISTRY: bcmi-labs/brick-registry

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet "pyyaml==6.0.2"

      - name: Build the zip of the tagged tree
        run: |
          mkdir -p dist
          # the tracked tree at the zip root: src/<name>/..., docs/, examples/, LICENSE, ...
          git archive --format=zip -o dist/brick.zip "$TAG"

      # Mirror of the checks in .github/scripts/submit.py of the registry
      # (inspect_zip and read_config). Keep the two in sync.
      - name: Check the zip as the registry bot will
        id: brick
        run: |
          python - dist/brick.zip "$TAG" <<'PY'
          import re, sys, zipfile
          from pathlib import Path
          import yaml

          zip_path, tag = Path(sys.argv[1]), sys.argv[2]
          REQUIRED_BRICK_FILES = ("__init__.py", "brick_config.yaml")
          REQUIRED_REPO_FILES = ("docs/README.md", "LICENSE")
          REQUIRED_EXAMPLE_FILES = ("app.yaml", "python/main.py")
          NS_RE = re.compile(r"^[a-z0-9-]+$")
          NAME_RE = re.compile(r"^[a-z][a-z0-9_]*$")
          HANDLE_RE = re.compile(r"^[A-Za-z0-9](?:-?[A-Za-z0-9]){0,38}$")
          SEMVER_RE = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$")

          def fail(msg):
              print(f"::error::{msg}"); sys.exit(1)

          # --- the archive, as the bot inspects it
          try:
              zf = zipfile.ZipFile(zip_path)
          except zipfile.BadZipFile:
              fail("the file is not a valid zip archive")
          with zf:
              if zf.testzip() is not None:
                  fail("the zip archive is corrupt")
              entries = []
              for info in zf.infolist():
                  name = info.filename
                  if name.startswith(("/", "\\")) or ".." in Path(name).parts:
                      fail(f"unsafe path in the zip: `{name}`")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      fail(f"symlinks are not allowed in the zip: `{name}`")
                  parts = [p for p in name.split("/") if p]
                  if not parts:
                      continue
                  if "__MACOSX" in parts or "__pycache__" in parts:
                      fail(f"remove `__pycache__`/`__MACOSX` from the repository (`{name}`)")
                  if not info.is_dir() and (info.external_attr >> 16) & 0o111:
                      fail(f"executable files are not allowed in the zip: `{name}` (chmod -x and commit)")
                  entries.append((parts, info.is_dir()))
              roots = {p[0] for p, _ in entries}
              if "src" in roots or "bricks" in roots:
                  prefix = ""
              elif len(roots) == 1 and any(len(p) > 1 for p, _ in entries):
                  prefix = next(iter(roots))
              else:
                  fail("the repository must have a `src/<brick_name>/` folder at its root")
              rel = [(p[1:] if prefix else p, d) for p, d in entries]
              rel = [(p, d) for p, d in rel if p]
              files = ["/".join(p) for p, d in rel if not d]
              if not any(p[0] == "src" for p, _ in rel):
                  if any(p[0] == "bricks" for p, _ in rel):
                      fail("old layout with the brick in `bricks/<brick_name>/`: move the module to `src/<brick_name>/`, its README.md to `docs/README.md` and its examples to `examples/` at the repository root, next to `LICENSE`")
                  fail("no `src/<brick_name>/` folder found")
              loose = sorted("/".join(p) for p, d in rel if p[0] == "src" and len(p) == 2 and not d)
              if loose:
                  fail("`src/` must contain only the brick folder, found the file(s): " + ", ".join(loose))
              brick_names = {p[1] for p, _ in rel if len(p) > 1 and p[0] == "src"}
              if len(brick_names) > 1:
                  fail("`src/` must contain exactly one brick folder, found: " + ", ".join(sorted(brick_names)))
              brick = next(iter(brick_names))
              if not NAME_RE.match(brick):
                  fail(f"the brick folder `src/{brick}/` must be a lowercase Python identifier ([a-z0-9_])")
              for required in REQUIRED_BRICK_FILES:
                  if f"src/{brick}/{required}" not in files:
                      fail(f"`src/{brick}/{required}` is missing")
              if any(p[:3] == ["src", brick, "examples"] for p, _ in rel):
                  fail(f"`src/{brick}/examples/` is not part of the module: move `examples/` to the repository root, next to `src/`")
              for required in REQUIRED_REPO_FILES:
                  if required not in files:
                      fail(f"`{required}` is missing")
              examples = sorted({p[1] for p, _ in rel if len(p) > 2 and p[0] == "examples"})
              for example in examples:
                  for required in REQUIRED_EXAMPLE_FILES:
                      if f"examples/{example}/{required}" not in files:
                          fail(f"`examples/{example}/` is not an App Lab app: `{required}` is missing")
              config_text = zf.read(f"{prefix + '/' if prefix else ''}src/{brick}/brick_config.yaml").decode("utf-8")

          # --- brick_config.yaml, as the bot reads it
          try:
              cfg = yaml.safe_load(config_text)
          except yaml.YAMLError as e:
              fail(f"`brick_config.yaml` cannot be parsed: {e}")
          if not isinstance(cfg, dict):
              fail("`brick_config.yaml` must be a YAML mapping")
          missing = [k for k in ("id", "version", "name", "description", "author", "author_handle", "brick_repo") if not str(cfg.get(k) or "").strip()]
          if missing:
              fail("`brick_config.yaml` is missing required fields: " + ", ".join(f"`{k}`" for k in missing))
          brick_id = str(cfg["id"]).strip()
          if brick_id.count(":") != 1:
              fail(f"`id: {brick_id}` must have the form `<namespace>:<brick_name>`")
          ns, name = brick_id.split(":")
          if not NS_RE.match(ns):
              fail(f"namespace `{ns}` must match [a-z0-9-]")
          if ns == "arduino":
              fail("the `arduino` namespace is reserved")
          if name != brick:
              fail(f"brick name `{name}` in the id does not match the folder `src/{brick}/`: folder name, brick name and Python module must coincide")
          handle = str(cfg["author_handle"]).strip().lstrip("@")
          if not HANDLE_RE.match(handle):
              fail(f"`author_handle: {handle}` is not a GitHub login")
          version = str(cfg["version"]).strip()
          if not SEMVER_RE.match(version):
              fail(f"`version: {version}` is not a semantic version (MAJOR.MINOR.PATCH)")
          if not str(cfg["brick_repo"]).strip().startswith("https://"):
              fail(f"`brick_repo: {cfg['brick_repo']}` must be an HTTPS URL")
          variables = cfg.get("variables") or []
          if not isinstance(variables, list) or any(not isinstance(v, dict) or not v.get("name") or not v.get("description") for v in variables):
              fail("`variables` must be a list and every variable needs `name` and `description`")
          if cfg.get("min_app_cli") is not None and not SEMVER_RE.match(str(cfg["min_app_cli"])):
              fail(f"`min_app_cli: {cfg['min_app_cli']}` is not a semantic version")
          if cfg.get("license") is not None and not str(cfg["license"]).strip():
              fail("`license` is present but empty; use an SPDX identifier such as `MIT` or `MPL-2.0`")
          for key in ("supported_boards", "requires_services", "ai_frameworks_compatibility"):
              v = cfg.get(key)
              if v is not None and (not isinstance(v, list) or not v or not all(isinstance(x, str) and x.strip() for x in v)):
                  fail(f"`{key}` must be a non-empty list of strings")
          for key in ("requires_display", "model"):
              v = cfg.get(key)
              if v is not None and (not isinstance(v, str) or not v.strip()):
                  fail(f"`{key}` must be a non-empty string")
          ports = cfg.get("ports")
          if ports is not None and (not isinstance(ports, list) or not ports or not all(isinstance(x, int) and not isinstance(x, bool) and 1 <= x <= 65535 for x in ports)):
              fail("`ports` must be a non-empty list of integers between 1 and 65535")
          mbb = cfg.get("model_by_boards")
          if mbb is not None and (not isinstance(mbb, list) or not mbb or not all(isinstance(x, dict) and str(x.get("platform") or "").strip() and str(x.get("model") or "").strip() for x in mbb)):
              fail("`model_by_boards` must be a non-empty list of `{platform, model}` entries")

          # --- the release
          if tag.lstrip("vV") != version:
              fail(f"tag `{tag}` does not match `version: {version}` in brick_config.yaml")

          api = "docs/api.md" if "docs/api.md" in files else "no docs/api.md"
          print(f"ok: {brick_id} {version}, {len(files)} files, module src/{brick}/, {api}, examples: {', '.join(examples) or 'none'}")
          import os
          # display name on one line: it becomes the prefilled issue title
          display_name = " ".join(str(cfg["name"]).split())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={brick}\nversion={version}\ndisplay_name={display_name}\n")
          PY

      - name: Name the zip and compute its SHA-256
        id: zip
        env:
          NAME: ${{ steps.brick.outputs.name }}
          VERSION: ${{ steps.brick.outputs.version }}
        run: |
          set -euo pipefail
          file="$NAME-$VERSION.zip"
          mv dist/brick.zip "dist/$file"
          sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          unzip -l "dist/$file"

      - name: Attach the zip to the release
        env:
          FILE: ${{ steps.zip.outputs.file }}
        run: gh release upload "$TAG" "dist/$FILE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Append the submission details to the release notes
        env:
          FILE: ${{ steps.zip.outputs.file }}
          SHA: ${{ steps.zip.outputs.sha }}
          DISPLAY_NAME: ${{ steps.brick.outputs.display_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
          # the registry bot completes the title as "[submission] <name> <version>"
          form=$(python3 -c 'import sys, urllib.parse as u; print("https://github.com/" + sys.argv[1] + "/issues/new?" + u.urlencode({"template": "submit-brick.yml", "title": sys.argv[2], "zip-url": sys.argv[3], "sha256": sys.argv[4]}, quote_via=u.quote))' "$REGISTRY" "$DISPLAY_NAME" "$url" "$SHA")
          {
            printf '%s\n\n---\n\n' "$NOTES"
            printf '[Click here to submit this release to Arduino® App Brick registry](%s)\n' "$form"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "zip: $url"
          echo "sha256: $SHA"

      - name: Mark the release as not submittable
        if: failure()
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '%s\n\n---\n\n' "$NOTES"
            printf '## ⚠️ Release not submittable to the Arduino® App Brick registry\n\n'
            printf 'The release workflow failed, so this release has no zip to submit. The reason is in [the workflow run](%s): fix the repository and publish a new release.\n' "$run_url"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
