# MQTT broker the brick publishes its readings to. The image is pinned by
# digest (multi-arch index of eclipse-mosquitto 2.0.22), as the App Bricks
# registry requires; /mosquitto-no-auth.conf ships with the image and opens
# an anonymous listener on 1883.
services:
  ambient-light-broker:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 || exit 1"]
      interval: 5s
      start_period: 5s
      timeout: 3s
      retries: 5
